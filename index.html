<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <meta
      name="description"
      content="Yilong Tang — AI engineer with a music technology background: research projects, music production, and photography."
    />
    <title>Yilong Tang — Academia · Music · Photography</title>
    <script>
      // Apply the saved theme (or the OS preference) before first paint so the
      // page never flashes the wrong colours. Mirrors src/lib/theme.ts.
      (function () {
        var pref = null
        try { pref = localStorage.getItem('theme') } catch (e) {}
        var dark = pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        // Browser UI colour (mobile address bar): matches --bg in index.css.
        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#121211' : '#fafaf8')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

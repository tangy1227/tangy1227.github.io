<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Yilong Tang — AI engineer with a music technology background: research projects, music production, and photography."
    />
    <title>Yilong Tang — Academia · Music · Photography</title>
    <script>
      // Apply the saved theme (or the OS preference) before first paint so the
      // page never flashes the wrong colours. Mirrors src/lib/theme.ts.
      (function () {
        var pref = null
        try { pref = localStorage.getItem('theme') } catch (e) {}
        var dark = pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
